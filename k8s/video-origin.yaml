# video-origin: Deployment + Service
# Teaching points baked in: probes (liveness vs readiness), resource requests/limits,
# rolling update strategy, Prometheus scrape annotations.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-origin
  labels:
    app: video-origin
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # never drop below capacity during a rollout
      maxSurge: 1
  selector:
    matchLabels:
      app: video-origin
  template:
    metadata:
      labels:
        app: video-origin
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: video-origin
          image: video-origin:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          # readiness: "can I take traffic?" — gate for Service endpoints
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          # liveness: "am I stuck? restart me" — deliberately more tolerant
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 512Mi   # incident 2 will lower this to force OOMKilled
---
apiVersion: v1
kind: Service
metadata:
  name: video-origin
  labels:
    app: video-origin
spec:
  selector:
    app: video-origin
  ports:
    - name: http
      port: 80
      targetPort: 8080
